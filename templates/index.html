<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Data Visualizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 750px;
            margin: auto;
            background: #ffffff;
            padding: 25px 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 8px 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            background-color: #0056b3;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }
        button:hover {
            background-color: #004085;
        }
        .flashes {
            background-color: #f8d7da;
            color: #721c24;
            padding: 10px 15px;
            margin-bottom: 15px;
            border: 1px solid #f5c6cb;
            border-radius: 4px;
        }
        .flashes p {
            margin: 4px 0;
        }
        .chart-container {
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Stock Data Visualizer</h1>

        <!-- Flash messages for validation and API errors -->
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flashes">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="symbol">Choose Symbol:</label>
                <select name="symbol" id="symbol">
                    <option value="" disabled selected>Select a stock symbol</option>
                    {% for sym in symbols %}
                        <option value="{{ sym }}">{{ sym }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="chart_type">Choose Chart Type:</label>
                <select name="chart_type" id="chart_type">
                    <option value="" disabled selected>Select a chart type</option>
                    <option value="1">1. Bar</option>
                    <option value="2">2. Line</option>
                </select>
            </div>

            <div class="form-group">
                <label for="time_series">Choose Time Series:</label>
                <select name="time_series" id="time_series">
                    <option value="" disabled selected>Select a time series</option>
                    <option value="1">1. Intraday</option>
                    <option value="2">2. Daily</option>
                    <option value="3">3. Weekly</option>
                    <option value="4">4. Monthly</option>
                </select>
            </div>

            <div class="form-group">
                <label for="start_date">Start Date:</label>
                <input type="date" name="start_date" id="start_date">
            </div>

            <div class="form-group">
                <label for="end_date">End Date:</label>
                <input type="date" name="end_date" id="end_date">
            </div>

            <button type="submit">Submit</button>
        </form>

        {% if chart_svg %}
            <div class="chart-container">
                {{ chart_svg|safe }}
            </div>
        {% endif %}
    </div>
</body>
</html>
